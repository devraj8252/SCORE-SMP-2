# ==============================================================================
#                             ScoresSMP Configuration
# ==============================================================================

# Global settings
settings:
  # Enable debug messages in the console
  debug: false

# Individual Score type configurations
items:
  FIRE:
    display_name: "Fire Score"
    base_material: "ORANGE_DYE"
    base_model_data: 1000000
    recipe:
      item1: "BLAZE_ROD"
      item2: "MAGMA_CREAM"
    cooldowns:
      left_click: 30
      right_click: 15
      shift_click: 60
    abilities:
      left_click:
        name: "Fire Resistance"
        duration_per_level: 200 # In ticks (20 ticks = 1 second)
      right_click:
        name: "Fireball"
        yield_base: 1.5
        yield_per_level: 0.5
      shift_click:
        name: "Ignite Ring"
        range_per_level: 5.0
        fire_ticks_per_level: 100
    progression:
      required_progress_lv1: 50
      required_progress_lv2: 150
      challenge_description: "Kill Nether Mobs."
      entities:
        - "BLAZE"
        - "GHAST"
        - "MAGMA_CUBE"
        - "PIGLIN"
    loot:
      structures:
        bastion: 0.20
        ruined_portal: 0.20
        nether_bridge: 0.20
      entities:
        BLAZE: 0.05
        GHAST: 0.05
        MAGMA_CUBE: 0.05
        PIGLIN: 0.05

